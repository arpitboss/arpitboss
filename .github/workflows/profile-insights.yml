
name: Update GitHub Profile Insights

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Profile Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: arpitboss
          filename: github-metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update GitHub profile metrics [Skip GitHub Action]"

          config_timezone: Asia/Kolkata
          config_order: base.header, base.activity, base.community, base.repositories, isocalendar, languages, achievements, habits

          base: header, activity, community, repositories, metadata

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_other: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_achievements: yes
          plugin_achievements_display: detailed

          plugin_habits: yes

          retries: 3
          retries_delay: 300
